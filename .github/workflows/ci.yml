name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run CI scripts (Linux and macOS)
        if: runner.os != 'Windows'
        run: bash scripts/ci.sh
      - name: Run CI script (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\ci.bat
